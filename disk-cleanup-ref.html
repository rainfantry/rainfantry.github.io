<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>disk-ref | Windows Disk Cleanup &amp; File Recon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a1628;
  --bg-dark:#060d18;
  --bg-card:#0f1f32;
  --border:#1a3550;
  --border-light:#234568;
  --text:#e6f0f8;
  --text-dim:#8ba8c4;
  --text-muted:#5d7a94;
  --text-faint:#3d5570;
  --blue:#00d4ff;
  --blue-bg:#0a2a3a;
  --blue-border:#0e4060;
  --green:#00ff88;
  --green-bg:#0a2a1a;
  --red:#ff4757;
  --orange:#ffa657;
  --cyan:#00d4ff;
  --purple:#a78bfa;
  --sidebar-w:280px;
}

html,body{height:100%;overflow:hidden}

body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg-dark);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  display:flex;
  flex-direction:column;
}

/* ── TOPBAR ── */
#topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  height:52px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:100;
}

#hamburger{
  display:none;
  background:none;
  border:none;
  cursor:pointer;
  padding:8px;
  color:var(--text-dim);
  flex-shrink:0;
}
#hamburger svg{width:20px;height:20px}

#brand{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
  color:var(--blue);
  white-space:nowrap;
  flex-shrink:0;
  letter-spacing:0.02em;
}
#brand span{color:var(--text-muted);font-weight:400}

#search-wrap{
  flex:1;
  max-width:600px;
  position:relative;
}
#search{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-radius:6px;
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  padding:7px 12px 7px 34px;
  outline:none;
  transition:border-color .15s;
}
#search:focus{border-color:var(--blue)}
#search::placeholder{color:var(--text-muted)}
#search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);pointer-events:none;
}

#result-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-muted);
  white-space:nowrap;
  flex-shrink:0;
}

/* ── BODY LAYOUT ── */
#layout{
  display:flex;
  flex:1;
  overflow:hidden;
}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar-w);
  background:var(--bg);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  overflow:hidden;
}

#sidebar-inner{
  flex:1;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--border-light) transparent;
}
#sidebar-inner::-webkit-scrollbar{width:4px}
#sidebar-inner::-webkit-scrollbar-track{background:transparent}
#sidebar-inner::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}

/* ── TRIAGE CONFIG ── */
#triage-section{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
}
.triage-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
  color:var(--blue);
  letter-spacing:0.12em;
  text-transform:uppercase;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.triage-label::before{
  content:'';
  display:inline-block;
  width:6px;height:6px;
  background:var(--blue);
  border-radius:50%;
}

.config-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}
.config-row label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-muted);
  width:62px;
  flex-shrink:0;
}
.config-row input{
  flex:1;
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-radius:4px;
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:4px 7px;
  outline:none;
  transition:border-color .15s;
  min-width:0;
}
.config-row input:focus{border-color:var(--blue)}

#apply-btn{
  width:100%;
  margin-top:8px;
  background:var(--blue-bg);
  border:1px solid var(--blue-border);
  color:var(--blue);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  padding:6px;
  border-radius:5px;
  cursor:pointer;
  text-transform:uppercase;
  transition:background .15s,border-color .15s;
}
#apply-btn:hover{background:rgba(0,212,255,.12);border-color:var(--blue)}
#apply-btn:active{transform:scale(.98)}
#apply-status{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--green);
  text-align:center;
  margin-top:5px;
  min-height:14px;
  opacity:0;
  transition:opacity .3s;
}
#apply-status.show{opacity:1}

/* ── NAV TREE ── */
#nav-section{padding:10px 0 8px}
.nav-header{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
  color:var(--text-muted);
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:4px 14px 6px;
}

.cat-toggle{
  width:100%;
  background:none;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 14px;
  text-align:left;
  color:var(--text-dim);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:12px;
  font-weight:500;
  transition:background .12s,color .12s;
  border-left:2px solid transparent;
}
.cat-toggle:hover{background:rgba(0,212,255,.04);color:var(--text)}
.cat-toggle.active{color:var(--blue);border-left-color:var(--blue);background:rgba(0,212,255,.05)}

.cat-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  background:var(--border);
  color:var(--text-muted);
  border-radius:3px;
  padding:1px 5px;
  margin-left:auto;
}

.cat-arrow{
  margin-left:auto;
  width:14px;height:14px;
  color:var(--text-muted);
  transition:transform .2s;
  flex-shrink:0;
}
.cat-toggle.open .cat-arrow{transform:rotate(90deg)}

.cat-children{
  overflow:hidden;
  max-height:0;
  transition:max-height .25s ease;
}
.cat-children.open{max-height:600px}

.nav-cmd{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 14px 4px 28px;
  cursor:pointer;
  font-size:11px;
  color:var(--text-muted);
  transition:color .12s,background .12s;
  background:none;
  border:none;
  width:100%;
  text-align:left;
}
.nav-cmd:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-cmd::before{
  content:'';
  display:inline-block;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--text-faint);
  flex-shrink:0;
}

/* ── MAIN PANEL ── */
#main{
  flex:1;
  overflow-y:auto;
  padding:20px 24px 40px;
  scrollbar-width:thin;
  scrollbar-color:var(--border-light) transparent;
}
#main::-webkit-scrollbar{width:6px}
#main::-webkit-scrollbar-track{background:transparent}
#main::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

.cat-section{margin-bottom:32px}

.cat-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.cat-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  color:var(--blue);
  background:var(--blue-bg);
  border:1px solid var(--blue-border);
  border-radius:4px;
  padding:2px 8px;
  letter-spacing:0.06em;
}
.cat-title{
  font-size:16px;
  font-weight:600;
  color:var(--text);
}
.cat-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--text-muted);
  margin-left:auto;
}

/* ── COMMAND CARD ── */
.cmd-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:12px;
  transition:border-color .15s;
  overflow:hidden;
}
.cmd-card:hover{border-color:var(--border-light)}

.cmd-header{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 14px 8px;
}
.cmd-title{
  flex:1;
  font-size:14px;
  font-weight:600;
  color:var(--text);
  line-height:1.3;
}
.cmd-badges{
  display:flex;
  gap:6px;
  flex-shrink:0;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:0.06em;
  padding:2px 7px;
  border-radius:3px;
  text-transform:uppercase;
}
.badge-ps{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.badge-cmd{background:rgba(255,166,87,.1);color:var(--orange);border:1px solid rgba(255,166,87,.2)}
.badge-safe{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.2)}
.badge-caution{background:rgba(255,166,87,.1);color:var(--orange);border:1px solid rgba(255,166,87,.2)}
.badge-danger{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.2)}
.badge-admin{background:rgba(255,71,87,.08);color:var(--red);border:1px solid rgba(255,71,87,.15)}

.cmd-desc{
  font-size:12px;
  color:var(--text-dim);
  padding:0 14px 8px;
  line-height:1.55;
}
.cmd-desc code{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--blue);
  background:var(--blue-bg);
  padding:0 4px;
  border-radius:3px;
}

.cmd-output{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-muted);
  padding:0 14px 8px;
  font-style:italic;
}
.cmd-output::before{
  content:'→ ';
  color:var(--text-faint);
}

.cmd-code-wrap{
  position:relative;
  margin:0 14px 12px;
}
.cmd-text{
  display:block;
  background:var(--bg-dark);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px 44px 10px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:#c9e1f5;
  white-space:pre-wrap;
  word-break:break-all;
  line-height:1.6;
  max-height:200px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--border-light) transparent;
}

.cmd-actions{
  display:flex;
  gap:6px;
  margin:0 14px 12px;
}
.btn-copy,.btn-copyps{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:5px 12px;
  border-radius:4px;
  cursor:pointer;
  border:1px solid;
  transition:background .12s,color .12s;
  white-space:nowrap;
}
.btn-copy{
  background:var(--blue-bg);
  border-color:var(--blue-border);
  color:var(--blue);
}
.btn-copy:hover{background:rgba(0,212,255,.15)}
.btn-copy.copied{
  background:rgba(0,255,136,.1);
  border-color:rgba(0,255,136,.3);
  color:var(--green);
}
.btn-copyps{
  background:rgba(167,139,250,.08);
  border-color:rgba(167,139,250,.2);
  color:var(--purple);
}
.btn-copyps:hover{background:rgba(167,139,250,.15)}
.btn-copyps.copied{
  background:rgba(0,255,136,.1);
  border-color:rgba(0,255,136,.3);
  color:var(--green);
}

/* No results */
#no-results{
  display:none;
  text-align:center;
  padding:60px 20px;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
}
#no-results::before{
  content:'[ 0 matches ]';
  display:block;
  font-size:20px;
  color:var(--text-faint);
  margin-bottom:10px;
}

/* ── FOOTER ── */
#footer{
  border-top:1px solid var(--border);
  padding:8px 20px;
  font-size:11px;
  color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
  display:flex;
  gap:16px;
  align-items:center;
  flex-shrink:0;
  background:var(--bg);
}
#footer a{color:var(--text-muted);text-decoration:none}
#footer a:hover{color:var(--blue)}

/* ── OVERLAY (mobile sidebar) ── */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:199;
}

/* ── MOBILE ── */
@media(max-width:767px){
  :root{--sidebar-w:270px}

  #hamburger{display:flex}
  #brand{font-size:11px}

  #sidebar{
    position:fixed;
    left:0;top:0;bottom:0;
    z-index:200;
    transform:translateX(-100%);
    transition:transform .25s ease;
    width:var(--sidebar-w);
  }
  #sidebar.open{transform:translateX(0)}
  #overlay.show{display:block}

  #main{padding:14px 12px 40px}

  .cmd-text{font-size:11px}
  .cat-title{font-size:14px}

  .cmd-header{flex-direction:column;gap:6px}
  .cmd-badges{justify-content:flex-start}
}

/* Highlight search matches */
mark{
  background:rgba(0,212,255,.18);
  color:var(--blue);
  border-radius:2px;
  padding:0 1px;
}

/* Scrollbar for cmd-text */
.cmd-text::-webkit-scrollbar{height:3px;width:3px}
.cmd-text::-webkit-scrollbar-track{background:transparent}
.cmd-text::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}

/* Token highlight colors in code */
.tok-kw{color:var(--purple)}
.tok-str{color:var(--green)}
.tok-op{color:var(--cyan)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button id="hamburger" aria-label="Toggle menu" onclick="toggleSidebar()">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 4h16v2H2V4zm0 5h16v2H2V9zm0 5h16v2H2v-2z"/></svg>
  </button>
  <div id="brand">disk-ref<span> // win disk cleanup &amp; recon</span></div>
  <div id="search-wrap">
    <svg id="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.867-3.834zm-5.242 1.406a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
    </svg>
    <input id="search" type="text" placeholder="Search commands, descriptions, flags..." autocomplete="off" spellcheck="false">
  </div>
  <div id="result-count"></div>
</div>

<div id="layout">

<!-- SIDEBAR -->
<div id="overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div id="sidebar-inner">

    <!-- TRIAGE CONFIG -->
    <div id="triage-section">
      <div class="triage-label">Triage Config</div>
      <div class="config-row">
        <label for="cfg-drive">DRIVE</label>
        <input id="cfg-drive" type="text" value="C:" placeholder="C:">
      </div>
      <div class="config-row">
        <label for="cfg-path">PATH</label>
        <input id="cfg-path" type="text" value="C:\Users" placeholder="C:\Users">
      </div>
      <div class="config-row">
        <label for="cfg-minsize">MINSIZE (MB)</label>
        <input id="cfg-minsize" type="text" value="500" placeholder="500">
      </div>
      <div class="config-row">
        <label for="cfg-ext">EXT</label>
        <input id="cfg-ext" type="text" value=".qcow2|.vmdk|.vhd|.vhdx|.iso" placeholder=".iso|.vmdk">
      </div>
      <div class="config-row">
        <label for="cfg-user">USER</label>
        <input id="cfg-user" type="text" value="%USERNAME%" placeholder="%USERNAME%">
      </div>
      <div class="config-row">
        <label for="cfg-days">DAYS</label>
        <input id="cfg-days" type="text" value="30" placeholder="30">
      </div>
      <button id="apply-btn" onclick="applyConfig()">&#9654; Apply Config</button>
      <div id="apply-status">Config applied.</div>
    </div>

    <!-- NAV TREE -->
    <div id="nav-section">
      <div class="nav-header">Categories</div>
      <div id="cat-nav"></div>
    </div>

  </div>
</aside>

<!-- MAIN PANEL -->
<main id="main">
  <div id="cmd-container"></div>
  <div id="no-results">No commands matched your search.</div>
</main>

</div>

<!-- FOOTER -->
<footer id="footer">
  <span>by George Wu @ <a href="https://22div.com.au" target="_blank">22div.com.au</a></span>
  <span style="margin-left:auto;color:var(--text-faint)">disk-ref v1.0 &mdash; 2026</span>
</footer>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const CATEGORIES = [
  {
    id: "cat01", num: "01", title: "Drive Overview",
    commands: [
      {
        id: "c01a", title: "Check Free Space",
        badges: ["ps"],
        output: "UsedGB / FreeGB table",
        desc: "Shows used and free GB on the target drive instantly.",
        cmd: `Get-PSDrive DRIVE | Select-Object @{Name="UsedGB";Expression={[math]::Round($_.Used/1GB,1)}}, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,1)}}`
      },
      {
        id: "c01b", title: "List All Volumes",
        badges: ["ps"],
        desc: "Lists every mounted drive/volume with usage.",
        cmd: `Get-PSDrive | Where-Object { $_.Provider -like "*FileSystem*" } | Select-Object Name, @{Name="UsedGB";Expression={[math]::Round($_.Used/1GB,1)}}, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,1)}}, Root`
      },
      {
        id: "c01c", title: "Check Pagefile & Hiberfil",
        badges: ["ps"],
        desc: `Shows size of system reserved files. hiberfil = RAM dump for hibernate. Disable hibernate to free it: <code>powercfg /hibernate off</code>`,
        cmd: `Get-Item "DRIVE\\pagefile.sys","DRIVE\\hiberfil.sys","DRIVE\\swapfile.sys" -Force -ErrorAction SilentlyContinue | Select-Object Name, @{Name="SizeGB";Expression={[math]::Round($_.Length/1GB,1)}}`
      }
    ]
  },
  {
    id: "cat02", num: "02", title: "Folder Size Recon",
    commands: [
      {
        id: "c02a", title: "Top-Level Breakdown (Depth 2)",
        badges: ["ps"],
        desc: "Lists all subfolders in PATH sorted by size. Use Depth 2 for speed, increase for accuracy.",
        cmd: `Get-ChildItem "PATH" -ErrorAction SilentlyContinue -Directory | ForEach-Object { $size = (Get-ChildItem $_.FullName -Recurse -Depth 2 -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum; [PSCustomObject]@{ SizeGB = [math]::Round($size/1GB,2); Folder = $_.Name } } | Where-Object { $_.SizeGB -gt 0.1 } | Sort-Object SizeGB -Descending | Format-Table -AutoSize`
      },
      {
        id: "c02b", title: "Full Recursive Folder Size",
        badges: ["ps"],
        desc: "Returns exact total GB used by PATH recursively. Slower but accurate.",
        cmd: `(Get-ChildItem "PATH" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1GB`
      },
      {
        id: "c02c", title: "AppData Quick Breakdown",
        badges: ["ps"],
        desc: "Breaks down AppData\\Local to find bloated app caches.",
        cmd: `Get-ChildItem "DRIVE:\\Users\\USER\\AppData\\Local" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $s=(Get-ChildItem $_.FullName -Recurse -Depth 2 -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum; [PSCustomObject]@{SizeMB=[math]::Round($s/1MB,0);Name=$_.Name} } | Where-Object {$_.SizeMB -gt 100} | Sort-Object SizeMB -Descending | Format-Table -AutoSize`
      }
    ]
  },
  {
    id: "cat03", num: "03", title: "Large File Hunt",
    commands: [
      {
        id: "c03a", title: "Files Over MINSIZE MB in PATH",
        badges: ["ps"],
        desc: "Finds the largest files in PATH. Adjust MINSIZE down to cast wider net.",
        cmd: `Get-ChildItem -Path "PATH" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt MINSIZEMb } | Sort-Object Length -Descending | Select-Object -First 30 @{Name="SizeMB";Expression={[math]::Round($_.Length/1MB,0)}}, FullName | Format-Table -AutoSize`
      },
      {
        id: "c03b", title: "Find VM/Disk Images by Extension",
        badges: ["ps"],
        desc: "Scans entire drive for VM disk images. These are typically 2–50 GB each and often forgotten.",

// ─── BADGE MAP ───────────────────────────────────────────────────────────────
const BADGE_MAP = {
  ps:      {cls:"badge-ps",     label:"PowerShell"},
  cmd:     {cls:"badge-cmd",    label:"CMD/CLI"},
  safe:    {cls:"badge-safe",   label:"Safe"},
  caution: {cls:"badge-caution",label:"Caution"},
  danger:  {cls:"badge-danger", label:"Danger"},
  admin:   {cls:"badge-admin",  label:"Admin"},
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let configValues = {
  DRIVE: "C:",
  PATH: "C:\\Users",
  MINSIZE: "500",
  EXT: ".qcow2|.vmdk|.vhd|.vhdx|.iso",
  USER: "%USERNAME%",
  DAYS: "30"
};

// ─── BUILD DOM ───────────────────────────────────────────────────────────────
function buildAll() {
  const container = document.getElementById("cmd-container");
  const nav = document.getElementById("cat-nav");
  container.innerHTML = "";
  nav.innerHTML = "";

  CATEGORIES.forEach(cat => {
    // NAV entry
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "cat-toggle open";
    toggleBtn.dataset.catId = cat.id;
    toggleBtn.innerHTML = `
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-faint);width:20px;flex-shrink:0">${cat.num}</span>
      <span>${cat.title}</span>
      <span class="cat-badge">${cat.commands.length}</span>
      <svg class="cat-arrow" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>
    `;
    toggleBtn.onclick = () => toggleCat(cat.id);

    const childWrap = document.createElement("div");
    childWrap.className = "cat-children open";
    childWrap.id = `nav-children-${cat.id}`;

    cat.commands.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "nav-cmd";
      btn.textContent = c.title;
      btn.onclick = () => { scrollToCard(c.id); closeSidebar(); };
      childWrap.appendChild(btn);
    });

    nav.appendChild(toggleBtn);
    nav.appendChild(childWrap);

    // MAIN SECTION
    const section = document.createElement("div");
    section.className = "cat-section";
    section.id = cat.id;
    section.innerHTML = `
      <div class="cat-heading">
        <span class="cat-num">${cat.num}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-count">${cat.commands.length} cmd${cat.commands.length !== 1 ? 's' : ''}</span>
      </div>
    `;

    cat.commands.forEach(c => {
      section.appendChild(buildCard(c));
    });

    container.appendChild(section);
  });
}

function buildCard(c) {
  const card = document.createElement("div");
  card.className = "cmd-card";
  card.id = `card-${c.id}`;

  const badgeHTML = (c.badges || []).map(b => {
    const m = BADGE_MAP[b];
    return m ? `<span class="badge ${m.cls}">${m.label}</span>` : '';
  }).join("");

  const outputHTML = c.output ? `<div class="cmd-output">${c.output}</div>` : '';
  const descHTML = c.desc ? `<div class="cmd-desc">${c.desc}</div>` : '';

  const rawCmd = substituteConfig(c.cmd);

  card.innerHTML = `
    <div class="cmd-header">
      <div class="cmd-title">${c.title}</div>
      ${badgeHTML ? `<div class="cmd-badges">${badgeHTML}</div>` : ''}
    </div>
    ${descHTML}
    ${outputHTML}
    <div class="cmd-code-wrap">
      <pre class="cmd-text" id="cmdtext-${c.id}" data-raw="${escapeAttr(c.cmd)}">${escapeHtml(rawCmd)}</pre>
    </div>
    <div class="cmd-actions">
      <button class="btn-copy" onclick="copyCmd('${c.id}', this)">Copy</button>
      <button class="btn-copyps" onclick="copyCmdPS('${c.id}', this)">Copy PS</button>
    </div>
  `;
  return card;
}

// ─── SUBSTITUTION ────────────────────────────────────────────────────────────
function substituteConfig(raw) {
  const minsize = parseInt(configValues.MINSIZE) || 500;
  const minsizeMb = minsize + "MB";

  let out = raw;
  // Order matters — MINSIZE before generic replacements
  out = out.replace(/MINSIZEMb/g, minsizeMb);
  out = out.replace(/MINSIZE/g, configValues.MINSIZE);
  out = out.replace(/DRIVE/g, configValues.DRIVE);
  out = out.replace(/PATH/g, configValues.PATH);
  out = out.replace(/EXT/g, configValues.EXT);
  out = out.replace(/USER/g, configValues.USER);
  out = out.replace(/DAYS/g, configValues.DAYS);
  return out;
}

function applyConfig() {
  configValues.DRIVE   = document.getElementById("cfg-drive").value.trim() || "C:";
  configValues.PATH    = document.getElementById("cfg-path").value.trim() || "C:\\Users";
  configValues.MINSIZE = document.getElementById("cfg-minsize").value.trim() || "500";
  configValues.EXT     = document.getElementById("cfg-ext").value.trim() || ".iso";
  configValues.USER    = document.getElementById("cfg-user").value.trim() || "%USERNAME%";
  configValues.DAYS    = document.getElementById("cfg-days").value.trim() || "30";

  refreshAllCmds();

  const s = document.getElementById("apply-status");
  s.classList.add("show");
  setTimeout(() => s.classList.remove("show"), 1800);
}

function refreshAllCmds() {
  document.querySelectorAll(".cmd-text").forEach(el => {
    const raw = el.dataset.raw;
    el.textContent = substituteConfig(raw);
  });
}

// Debounced live update
let debounceTimer = null;
function setupLiveUpdate() {
  ["cfg-drive","cfg-path","cfg-minsize","cfg-ext","cfg-user","cfg-days"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyConfig, 300);
    });
  });
}

// ─── COPY ────────────────────────────────────────────────────────────────────
function copyCmd(id, btn) {
  const el = document.getElementById("cmdtext-" + id);
  navigator.clipboard.writeText(el.textContent.trim()).then(() => {
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1600);
  }).catch(() => {
    fallbackCopy(el.textContent.trim());
  });
}

function copyCmdPS(id, btn) {
  const el = document.getElementById("cmdtext-" + id);
  const cmd = el.textContent.trim();
  const wrapped = `powershell -NoProfile -Command "${cmd.replace(/"/g, '\\"')}"`;
  navigator.clipboard.writeText(wrapped).then(() => {
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy PS"; btn.classList.remove("copied"); }, 1600);
  }).catch(() => fallbackCopy(wrapped));
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function setupSearch() {
  const inp = document.getElementById("search");
  inp.addEventListener("input", () => filterCommands(inp.value.trim()));
}

function filterCommands(q) {
  const count = document.getElementById("result-count");
  const noRes = document.getElementById("no-results");
  const lq = q.toLowerCase();
  let total = 0;

  if (!q) {
    document.querySelectorAll(".cat-section").forEach(s => s.style.display = "");
    document.querySelectorAll(".cmd-card").forEach(c => c.style.display = "");
    count.textContent = "";
    noRes.style.display = "none";
    return;
  }

  document.querySelectorAll(".cat-section").forEach(section => {
    let visCount = 0;
    section.querySelectorAll(".cmd-card").forEach(card => {
      const text = card.innerText.toLowerCase();
      if (text.includes(lq)) {
        card.style.display = "";
        visCount++;
        total++;
      } else {
        card.style.display = "none";
      }
    });
    section.style.display = visCount > 0 ? "" : "none";
  });

  count.textContent = total ? `${total} result${total !== 1 ? 's' : ''}` : "";
  noRes.style.display = total ? "none" : "block";
}

// ─── NAV / TOGGLE ────────────────────────────────────────────────────────────
function toggleCat(catId) {
  const btn = document.querySelector(`.cat-toggle[data-cat-id="${catId}"]`);
  const children = document.getElementById(`nav-children-${catId}`);
  btn.classList.toggle("open");
  children.classList.toggle("open");
}

function scrollToCard(cmdId) {
  const el = document.getElementById(`card-${cmdId}`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.style.borderColor = "var(--blue)";
    setTimeout(() => el.style.borderColor = "", 1200);
  }
}

// ─── MOBILE SIDEBAR ──────────────────────────────────────────────────────────
function toggleSidebar() {
  const sb = document.getElementById("sidebar");
  const ov = document.getElementById("overlay");
  sb.classList.toggle("open");
  ov.classList.toggle("show");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(s) {
  return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

// ─── INIT ────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  buildAll();
  setupSearch();
  setupLiveUpdate();
});
</script>
